name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livbee-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: livbee-project/.nvmrc
          cache: 'npm'
          cache-dependency-path: livbee-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
